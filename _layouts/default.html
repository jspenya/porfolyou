<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.classList.add('js')</script>
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  {% include nav.html %}
  <main>{{ content }}</main>
  {% include footer.html %}

  <script>
    (function () {
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var nav = document.querySelector('.nav');
      var menuButton = document.querySelector('.nav__toggle');
      var menu = document.querySelector('.nav__links');
      var stageCaption = document.querySelector('[data-stage-caption]');
      var captions = {
        reachboost: 'Agency outreach product · Rails developer',
        jubilee: 'Personal finance product · Creator and developer'
      };

      function setStage(project) {
        document.querySelectorAll('[data-stage-media]').forEach(function (media) {
          media.classList.toggle('is-active', media.dataset.stageMedia === project);
        });
        document.querySelectorAll('[data-stage-control]').forEach(function (control) {
          var active = control.dataset.stageControl === project;
          control.classList.toggle('is-active', active);
          control.setAttribute('aria-pressed', String(active));
        });
        if (stageCaption) stageCaption.textContent = captions[project];
      }

      document.querySelectorAll('[data-stage-control]').forEach(function (control) {
        control.addEventListener('click', function () {
          var project = control.dataset.stageControl;
          setStage(project);
          var target = document.getElementById(project);
          if (target) target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
        });
      });

      if (menuButton && menu) {
        menuButton.addEventListener('click', function () {
          var open = menu.classList.toggle('is-open');
          menuButton.setAttribute('aria-expanded', String(open));
        });
        menu.querySelectorAll('a').forEach(function (link) {
          link.addEventListener('click', function () {
            menu.classList.remove('is-open');
            menuButton.setAttribute('aria-expanded', 'false');
          });
        });
      }

      var revealObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll('[data-reveal]').forEach(function (item) { revealObserver.observe(item); });

      var projectObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting && entry.target.dataset.project) setStage(entry.target.dataset.project);
        });
      }, { rootMargin: '-35% 0px -35% 0px' });
      document.querySelectorAll('[data-project]').forEach(function (item) { projectObserver.observe(item); });

      function syncNavTheme() {
        if (!nav) return;
        var sample = document.elementFromPoint(window.innerWidth - 120, 34);
        var onDark = sample && sample.closest('.work, .contact, .footer');
        nav.classList.toggle('nav--light', Boolean(onDark));
      }
      syncNavTheme();
      window.addEventListener('scroll', syncNavTheme, { passive: true });
      window.addEventListener('resize', syncNavTheme);

      var emailForm = document.querySelector('[data-email-form]');
      if (emailForm) {
        emailForm.addEventListener('submit', function (event) {
          event.preventDefault();
          var note = emailForm.querySelector('input').value.trim();
          var subject = note || 'Let\'s work together';
          var body = note ? 'Hi Steph,\n\nI\'d like help with: ' + note + '\n\n' : 'Hi Steph,\n\nI\'d like to talk about a project.\n\n';
          window.location.href = 'mailto:pena.jstephen@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        });
      }
    })();
  </script>
</body>
</html>
