<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.classList.add('js')</script>
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="icon" href="{{ '/favicon.png' | relative_url }}?v=charcoal-butter" type="image/png" sizes="64x64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Lora:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  {% include nav.html %}
  <a class="skip-link" href="#main">skip to content</a>
  <main id="main">{{ content }}</main>
  {% include footer.html %}

  <script>
    (function () {
      var emailForm = document.querySelector('[data-email-form]');
      if (emailForm) {
        emailForm.addEventListener('submit', function (event) {
          event.preventDefault();
          var note = emailForm.querySelector('input').value.trim();
          var subject = note || 'Let\'s work together';
          var body = note ? 'Hi Steph,\n\nI\'d like help with: ' + note + '\n\n' : 'Hi Steph,\n\nI\'d like to talk about a project.\n\n';
          window.location.href = 'mailto:pena.jstephen@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
        });
      }
    })();
  </script>
</body>
</html>
