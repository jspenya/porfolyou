<section class="contact section-block" id="contact" aria-labelledby="contact-title">
  <div class="contact__inner" data-reveal>
    <h2 id="contact-title">Have a product that needs a steady hand?<br><span>Tell me what you’re building.</span></h2>
    <form class="contact__composer" data-email-form>
      <label class="sr-only" for="project-note">What do you need help with?</label>
      <input id="project-note" name="project" type="text" placeholder="A Rails app, feature, rescue…" autocomplete="off">
      <button type="submit" aria-label="Write an email to Steph">Send</button>
    </form>
    <p class="contact__note">This opens your email app with a draft addressed to me.</p>
    <dl class="contact__details">
      <div><dt>Email</dt><dd><a href="mailto:pena.jstephen@gmail.com">pena.jstephen@gmail.com</a></dd></div>
      <div><dt>Based in</dt><dd>Cagayan de Oro, Philippines</dd></div>
      <div><dt>Working with</dt><dd>Remote clients worldwide</dd></div>
    </dl>
  </div>
</section>
